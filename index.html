const NEEDS = [
  {em:"💼", ids:["ml","move","aire","ft","educs","transforama"]},
  {em:"⚽", cat:"sport"},
  {em:"🎟️", cat:"culture"},
  {em:"🗣️", ids:["educs","imaje","planning"]},
  {em:"📚", ids:["source","college","educs"]},
  {em:"📄", cat:"droits"},
  {em:"❤️", cat:"sante"},
  {em:"🎮", cat:"loisir"}
];
const EVENTS = [
  {season:"spring", items:[{em:"⚽", name:"Fin de match pour la violence", k:"ev1"},{em:"🎉", name:"Belle Fête de Mai", k:"ev2"}]},
  {season:"autumn", items:[{em:"🏆", name:"Tournoi foot « Droit au job »", k:"ev3"},{em:"💼", name:"Forum Emploi", k:"ev4"}]}
];
const SOS = [["119","tel:119","sos119"],["3018","tel:3018","sos3018"],["15","tel:15","sos15"],["17","tel:17","sos17"],["112","tel:112","sos112"],["114","sms:114","sos114"]];

/* ========================================================= ÉTAT */
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let favs = new Set(store.get("cj3-favs",[]));
function initialLang(){
  const saved=store.get("cj3-lang",null); if(saved&&T[saved]) return saved;
  const n=(navigator.language||"fr").slice(0,2);
  return ({en:"en",ar:"ar",tr:"tr"})[n]||"fr";
}
let lang = initialLang();
let state = {cat:"all", q:"", need:null, favOnly:false};

const $ = s => document.querySelector(s);
const t = k => (T[lang][k] ?? T.fr[k]);
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const telHref = x => "tel:"+x.replace(/\s/g,"");
const mapHref = a => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ltr = s => `<bdi dir="ltr">${esc(s)}</bdi>`;
const desc = p => (T[lang].d[p.id] ?? T.fr.d[p.id]);
const catLabel = c => (T[lang].cats[c] ?? T.fr.cats[c]);
const extraAddr = a => a.replace("(PSY)","("+t("psy")+")");

/* ========================================================= RENDU */
function renderLangs(){
  $("#langs").innerHTML = LANGS.map(l=>`<button class="lang" lang="${l.html||l.code}" data-l="${l.code}" aria-pressed="${l.code===lang}">${l.label}</button>`).join("");
}
function renderStatic(){
  const L = LANGS.find(l=>l.code===lang);
  document.documentElement.lang = lang==="km" ? "zdj" : lang;
  document.documentElement.dir = L.rtl ? "rtl" : "ltr";
  if(lang==="ar") document.documentElement.lang="ar";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  // titres de section avec mot souligné en jaune (dernier mot)
  ["needsTitle","addrTitle","evTitle"].forEach(k=>{
    const el=document.querySelector(`[data-t="${k}"]`); const words=t(k).split(" ");
    const last=words.pop(); el.innerHTML=(words.length?esc(words.join(" "))+" ":"")+`<span class="u">${esc(last)}</span>`;
  });
  $("#q").placeholder=t("ph"); $("#q").setAttribute("aria-label",t("search"));
  $("#needs").innerHTML = NEEDS.map((n,i)=>{const [a,b]=t("needs")[i];return `<button class="need" data-i="${i}"><span class="em">${n.em}</span><b>${esc(a)}</b><small>${esc(b)}</small></button>`}).join("");
  $("#seasons").innerHTML = EVENTS.map(s=>`<div class="season ${s.season}"><h3>${s.season==="spring"?"🌸":"🍂"} ${esc(t(s.season))}</h3>${s.items.map(e=>`<div class="ev"><div class="ico">${e.em}</div><div><b>${esc(e.name)}</b><small>${esc(t(e.k))} · ${esc(t("soon"))}</small></div></div>`).join("")}</div>`).join("");
  $("#sosGrid").innerHTML = SOS.map(([n,h,k])=>`<a href="${h}"><strong><bdi>${n}</bdi></strong><span>${esc(t(k))}</span></a>`).join("");
  const ids=["besoins","adresses","agenda","sos"], ems=["🧭","📍","📅","🆘"];
  $("#nav").innerHTML = ids.map((id,i)=>`<a href="#${id}" data-s="${id}"><span class="e">${ems[i]}</span>${esc(t("nav")[i])}</a>`).join("");
  $("#nav").querySelectorAll("a").forEach(a=>a.classList.toggle("on",a.dataset.s===currentSec));
  $(".langs").setAttribute("aria-label","Langue · Language · اللغة · Lugha · Dil");
}
function renderChips(){
  let html="";
  if(state.need!==null) html+=`<button class="chip need-chip" aria-pressed="true" data-c="need">${esc(t("needs")[state.need][0])} ✕</button>`;
  html+=`<button class="chip" data-c="all" aria-pressed="${state.need===null&&state.cat==="all"}">✨ ${esc(t("all"))}</button>`;
  html+=Object.entries(CATS).map(([k,c])=>`<button class="chip" data-c="${k}" aria-pressed="${state.need===null&&state.cat===k}"><span class="dot" style="background:${c.color}"></span>${esc(catLabel(k))}</button>`).join("");
  $("#chips").innerHTML=html;
}
function filtered(){
  const q=norm(state.q).trim();
  const ids = state.need!==null ? NEEDS[state.need].ids : null;
  return PLACES.filter(p=>{
    if(ids && !ids.includes(p.id)) return false;
    if(!ids && state.cat!=="all" && p.cat!==state.cat) return false;
    if(state.favOnly && !favs.has(p.id)) return false;
    if(q){
      const hay=norm([p.name,desc(p),T.fr.d[p.id],p.addr,(p.extra||[]).join(" "),p.kw,catLabel(p.cat),T.fr.cats[p.cat]].join(" "));
      return q.split(/\s+/).every(w=>hay.includes(w));
    }
    return true;
  }).sort((a,b)=> ids ? ids.indexOf(a.id)-ids.indexOf(b.id) : 0);
}
function card(p){
  const c=CATS[p.cat];
  const addrs=[p.addr,...(p.extra||[]).map(extraAddr)];
  return `<article class="card" style="--c:${c.color}">
    <div class="top">
      <div>
        <div class="tags"><span class="tag">${c.em} ${esc(catLabel(p.cat))}</span>${p.age?`<span class="tag age">${esc(t("from").replace("{n}",p.age))}</span>`:""}</div>
        <h3 dir="ltr" style="text-align:start">${esc(p.name)}</h3>
      </div>
      <button class="fav" data-fav="${p.id}" aria-pressed="${favs.has(p.id)}" aria-label="${esc(t("favAria"))}">★</button>
    </div>
    <p class="desc">${esc(desc(p))}</p>
    <div class="info">
      ${addrs.map(a=>`<div><span class="i">📍</span><span>${ltr(a)}</span></div>`).join("")}
      ${p.tel.length?`<div><span class="i">📞</span><span>${p.tel.map(ltr).join(" · ")}</span></div>`:""}
      ${p.mail.map(m=>`<div><span class="i">✉️</span><span style="word-break:break-all">${ltr(m)}</span></div>`).join("")}
    </div>
    <div class="actions">
      ${p.tel.length?`<a class="btn primary" href="${telHref(p.tel[0])}" data-sheet="${p.id}">📞 ${esc(t("call"))}</a>`:""}
      <a class="btn" href="${mapHref(p.addr)}" target="_blank" rel="noopener">🗺️ ${esc(t("go"))}</a>
      ${p.mail.length?`<a class="btn" href="mailto:${p.mail[0]}" data-sheet="${p.id}">✉️ ${esc(t("write"))}</a>`:""}
    </div>
  </article>`;
}
function render(){
  renderChips();
  const list=filtered();
  $("#count").textContent=list.length+" "+(list.length>1?t("many"):t("one"));
  $("#grid").innerHTML=list.length?list.map(card).join(""):
    `<div class="empty"><b>${esc(t("emptyT"))}</b>${esc(state.favOnly?t("emptyFav"):t("emptyQ"))}</div>`;
}
function setLang(l){
  lang=l; store.set("cj3-lang",l);
  renderLangs(); renderStatic(); render();
}

/* ========================================================= ÉVÉNEMENTS */
$("#langs").addEventListener("click",e=>{const b=e.target.closest("[data-l]"); if(b) setLang(b.dataset.l)});
$("#needs").addEventListener("click",e=>{
  const b=e.target.closest(".need"); if(!b) return;
  const i=+b.dataset.i, n=NEEDS[i];
  state.q=""; $("#q").value="";
  if(n.cat){state.cat=n.cat;state.need=null} else {state.cat="all";state.need=i}
  render(); document.getElementById("adresses").scrollIntoView({behavior:"smooth"});
});
$("#chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  const c=b.dataset.c; state.need=null; state.cat = c==="need" ? "all" : c; render();
});
$("#q").addEventListener("input",e=>{
  state.q=e.target.value;
  if(state.q){state.need=null;state.cat="all"}
  render();
});
$("#searchBox").addEventListener("submit",e=>{e.preventDefault();$("#q").blur();document.getElementById("adresses").scrollIntoView({behavior:"smooth"})});
$("#favOnly").addEventListener("change",e=>{state.favOnly=e.target.checked;render()});
$("#grid").addEventListener("click",e=>{
  const f=e.target.closest("[data-fav]");
  if(f){const id=f.dataset.fav; favs.has(id)?favs.delete(id):favs.add(id); store.set("cj3-favs",[...favs]); f.setAttribute("aria-pressed",favs.has(id)); toast(favs.has(id)?t("favAdd"):t("favDel")); if(state.favOnly) render(); return;}
  const s=e.target.closest("[data-sheet]");
  if(s){e.preventDefault(); openSheet(PLACES.find(p=>p.id===s.dataset.sheet));}
});
function openSheet(p){
  const rows=[
    ...p.tel.map(x=>`<div class="row"><div><a href="${telHref(x)}" style="font-weight:800;font-size:19px;text-decoration:none">📞 ${ltr(x)}</a><small>${esc(t("tapCall"))}</small></div><button class="copy" data-copy="${x}">${esc(t("copy"))}</button></div>`),
    ...p.mail.map(m=>`<div class="row"><div><a href="mailto:${m}" style="font-weight:600;text-decoration:none;word-break:break-all">✉️ ${ltr(m)}</a></div><button class="copy" data-copy="${m}">${esc(t("copy"))}</button></div>`),
    `<div class="row"><div><a href="${mapHref(p.addr)}" target="_blank" rel="noopener" style="font-weight:600;text-decoration:none">📍 ${ltr(p.addr)}</a><small>${esc(t("openRoute"))}</small></div><button class="copy" data-copy="${esc(p.addr)}">${esc(t("copy"))}</button></div>`
  ];
  $("#sheet").innerHTML=`<button class="x" aria-label="${esc(t("close"))}">✕</button><h3 dir="ltr" style="text-align:start">${esc(p.name)}</h3><p style="color:var(--ink-2);margin:6px 0 8px">${esc(desc(p))}</p>${rows.join("")}`;
  $("#sheetBg").classList.add("open");
}
$("#sheetBg").addEventListener("click",async e=>{
  if(e.target.id==="sheetBg"||e.target.closest(".x")){$("#sheetBg").classList.remove("open");return}
  const c=e.target.closest("[data-copy]");
  if(c){try{await navigator.clipboard.writeText(c.dataset.copy);toast(t("copied"))}catch(err){toast(t("copyFail"))}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#sheetBg").classList.remove("open")});
$("#shareBtn").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(location.href.split("#")[0]);toast(t("linkCopied"))}catch(e){toast(t("copyFail"))}
});
let tt; function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),1900)}

let currentSec="besoins";
const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){currentSec=en.target.id;document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.s===currentSec))}})},{rootMargin:"-45% 0px -50% 0px"});
["besoins","adresses","agenda","sos"].forEach(id=>io.observe(document.getElementById(id)));
const fl=$("#filters");
new IntersectionObserver(([en])=>fl.classList.toggle("stuck",en.intersectionRatio<1),{threshold:[1],rootMargin:"-1px 0px 0px 0px"}).observe(fl);

setLang(lang);
</script>
